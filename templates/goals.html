{% extends 'base.html' %}
{% block content %}
<!-- ══════════════════════════════════════════════════════════════
   GOALS PAGE
══════════════════════════════════════════════════════════════ -->
<div class="page-section active" id="section-goals">
    <div class="section-header">
        <div>
            <h2 class="page-title">Savings <span>Goals</span></h2>
            <p class="page-subtitle mb-0">Track your progress and review every contribution.</p>
        </div>
        <button class="btn-primary-custom" onclick="openModal('addGoalModal')">
            <i class="bi bi-flag me-1"></i> New Goal
        </button>
    </div>

    <div class="row" id="goalsList">
        <div class="col-12">
            <div class="spinner-custom"></div>
        </div>
    </div>
</div>

<!-- ══════════════════════════════════════════════════════════════
   MODAL (Add/Withdraw Savings locally to this page)
══════════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="addSavingsModal">
    <div class="modal-box">
        <button class="modal-close" onclick="closeModal('addSavingsModal')">✕</button>
        <h4 id="addSavingsTitle">Update Savings</h4>
        <form id="addSavingsForm">
            <input type="hidden" id="savingsGoalId">
            <input type="hidden" id="savingsAction">
            <div class="mb-3">
                <label class="form-label">Amount (₹)</label>
                <input type="number" id="savingsAmount" name="amount" class="form-control" step="0.01" min="0.01"
                    required placeholder="0.00">
            </div>
            <button type="submit" class="btn-primary-custom w-100" id="savingsSubmitBtn">Submit</button>
        </form>
    </div>
</div>

<script>
    const API = {
        goals: '{% url "api_goals" %}',
        addSavings: (id) => `/add-savings/${id}/`,
        withdraw: (id) => `/withdraw/${id}/`,
        deleteGoal: (id) => `/delete-goal/${id}/`,
    };

    const fmt = n => '₹ ' + parseFloat(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function loadGoals() {
        fetch(API.goals, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
            .then(async r => {
                if (!r.ok) {
                    const text = await r.text();
                    try {
                        let j = JSON.parse(text);
                        throw new Error(j.traceback || j.error || 'Server error');
                    } catch (e) { throw new Error(text || 'Failed to load goals API'); }
                }
                return r.json();
            })
            .then(d => {
                const list = document.getElementById('goalsList');
                if (!d.goals || !d.goals.length) {
                    list.innerHTML = '<div class="col-12"><div class="no-data">No savings goals created. Click New Goal to get started.</div></div>';
                    return;
                }
                list.innerHTML = d.goals.map(g => {
                    const progress = Math.min(Number(g.progress_percentage), 100);
                    const remaining = Math.max(Number(g.target_amount) - Number(g.saved_amount), 0);
                    return `
            <div class="col-md-6 col-lg-4">
                <div class="goal-card">
                    <div class="goal-card-heading">
                        <div>
                            <span class="goal-eyebrow"><i class="bi bi-bullseye me-1"></i>Savings goal</span>
                            <h5>${escapeHtml(g.title)}</h5>
                        </div>
                        <button class="goal-delete-btn" type="button" data-goal-action="delete"
                            data-goal-id="${g.id}" data-goal-title="${escapeHtml(g.title)}"
                            aria-label="Delete ${escapeHtml(g.title)}"
                            title="Delete goal">
                            <i class="bi bi-trash3"></i>
                        </button>
                    </div>
                    <div class="goal-balance">
                        <strong>${fmt(g.saved_amount)}</strong>
                        <span>of ${fmt(g.target_amount)}</span>
                    </div>
                    <div class="progress goal-progress mb-2" role="progressbar"
                        aria-label="${escapeHtml(g.title)} progress" aria-valuenow="${progress}"
                        aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-bar" style="width: ${progress}%"></div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center goal-meta">
                        <span>${Number(g.progress_percentage).toFixed(1)}% complete</span>
                        <span><i class="bi bi-calendar3 me-1"></i>${escapeHtml(g.deadline)}</span>
                    </div>
                    <p class="goal-remaining">${remaining > 0 ? `${fmt(remaining)} left to reach your goal` : 'Goal reached — great work!'}</p>
                    <div class="d-flex gap-2 goal-actions">
                        <button class="btn-sm-custom goal-add-btn" type="button"
                            data-goal-action="add" data-goal-id="${g.id}" data-goal-title="${escapeHtml(g.title)}">
                            <i class="bi bi-plus-lg"></i> Add
                        </button>
                        <button class="btn-sm-custom goal-withdraw-btn" type="button"
                            data-goal-action="withdraw" data-goal-id="${g.id}" data-goal-title="${escapeHtml(g.title)}">
                            <i class="bi bi-dash-lg"></i> Withdraw
                        </button>
                    </div>
                </div>
                <div class="goal-history">
                    <div class="goal-history-heading">
                        <span><i class="bi bi-clock-history me-1"></i>Contribution history</span>
                        <span class="history-count">${g.history.length}</span>
                    </div>
                    ${g.history.length ? `
                    <ul class="history-list">
                        ${g.history.map(h => {
                            const withdrawn = Number(h.amount) < 0;
                            return `<li>
                                <span class="history-entry-icon ${withdrawn ? 'withdrawal' : 'deposit'}">
                                    <i class="bi bi-${withdrawn ? 'arrow-up-right' : 'arrow-down-left'}"></i>
                                </span>
                                <span class="history-entry-label">
                                    <strong>${withdrawn ? 'Withdrawal' : 'Added to savings'}</strong>
                                    <small>${escapeHtml(h.date)}</small>
                                </span>
                                <strong class="history-entry-amount ${withdrawn ? 'withdrawal-text' : ''}">
                                    ${withdrawn ? '−' : '+'}${fmt(Math.abs(Number(h.amount)))}
                                </strong>
                            </li>`;
                        }).join('')}
                    </ul>` : '<p class="history-empty">No contributions yet. Add savings to start building your history.</p>'}
                </div>
            </div>`;
                }).join('');
            })
            .catch(err => {
                const list = document.getElementById('goalsList');
                list.innerHTML = `<div class="col-12"><div class="alert alert-danger" style="white-space:pre-wrap; text-align:left; font-size:12px;">${escapeHtml(err.message)}</div></div>`;
                console.error("Error loading goals:", err);
            });
    }

    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, char => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[char]);
    }

    document.getElementById('goalsList').addEventListener('click', event => {
        const button = event.target.closest('[data-goal-action]');
        if (!button) return;
        const { goalAction, goalId, goalTitle } = button.dataset;
        if (goalAction === 'delete') {
            deleteGoal(goalId, goalTitle);
        } else {
            openSavingsModal(goalId, goalTitle, goalAction === 'withdraw');
        }
    });

    function deleteGoal(goalId, title) {
        if (!confirm(`Delete "${title}" and all of its contribution history? This cannot be undone.`)) return;

        const formData = new FormData();
        formData.append('csrfmiddlewaretoken', getCookie('csrftoken'));
        fetch(API.deleteGoal(goalId), {
            method: 'POST',
            body: formData,
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
            .then(async response => {
                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Unable to delete this goal.');
                }
                showToast('Savings goal deleted.', 'success');
                loadGoals();
            })
            .catch(error => showToast(error.message || 'Network error while deleting goal.', 'error'));
    }

    function openSavingsModal(goalId, title, isWithdraw) {
        document.getElementById('savingsGoalId').value = goalId;
        document.getElementById('savingsAction').value = isWithdraw ? 'withdraw' : 'add';
        document.getElementById('addSavingsTitle').innerHTML = `
        <i class="bi bi-${isWithdraw ? 'dash' : 'plus'}-circle me-2" style="color:var(--accent);"></i>
        ${isWithdraw ? 'Withdraw from' : 'Add Savings to'} <em>${escapeHtml(title)}</em>`;
        document.getElementById('savingsSubmitBtn').textContent = isWithdraw ? 'Withdraw' : 'Add Savings';
        document.getElementById('savingsAmount').value = '';
        openModal('addSavingsModal');
    }

    document.getElementById('addSavingsForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const goalId = document.getElementById('savingsGoalId').value;
        const action = document.getElementById('savingsAction').value;
        const fd = new FormData(this);
        const url = action === 'withdraw' ? API.withdraw(goalId) : API.addSavings(goalId);
        const msg = action === 'withdraw' ? 'Withdrawal recorded!' : 'Savings added!';
        ajaxPost(url, fd, msg, () => {
            closeModal('addSavingsModal');
            loadGoals();
        });
    });

    window.reloadAll = loadGoals;
    document.addEventListener('DOMContentLoaded', loadGoals);
</script>
{% endblock %}
