{% extends 'base.html' %}
{% block content %}
<!-- ══════════════════════════════════════════════════════════════
   TRANSACTIONS PAGE
══════════════════════════════════════════════════════════════ -->
<div class="page-section active" id="section-transactions">
    <div class="section-header">
        <div>
            <h2 class="page-title">All <span>Transactions</span></h2>
            <p class="page-subtitle mb-0">Your complete income and expense history, newest first.</p>
        </div>
        <button class="btn-primary-custom" onclick="openModal('addTransactionModal')">
            <i class="bi bi-plus-lg me-1"></i> Add Transaction
        </button>
    </div>

    <div class="transaction-toolbar">
        <label for="transactionTypeFilter">Show</label>
        <select id="transactionTypeFilter" class="form-select">
            <option value="">All transactions</option>
            <option value="income">Income only</option>
            <option value="expense">Expenses only</option>
        </select>
        <span class="transaction-filter-hint" id="transactionFilterHint">Select an income row and use the edit button to update it.</span>
    </div>

    <div class="card-panel">
        <div class="table-responsive-custom">
            <table class="table-custom">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Category</th>
                        <th class="text-end">Amount</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody id="fullTransactionsList">
                    <tr>
                        <td colspan="4">
                            <div class="spinner-custom"></div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ══════════════════════════════════════════════════════════════
   MODAL (Edit Tx locally to this page)
══════════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="editTransactionModal">
    <div class="modal-box">
        <button class="modal-close" onclick="closeModal('editTransactionModal')">✕</button>
        <h4><i class="bi bi-pencil-square me-2" style="color:var(--accent);"></i>Edit Transaction</h4>
        <form id="editTxForm">
            <input type="hidden" id="editTxPk">
            <div class="mb-3">
                <label class="form-label">Category</label>
                <select name="category" class="form-select" required id="editTxCategory"></select>
            </div>
            <div class="mb-3">
                <label class="form-label">Amount (₹)</label>
                <input type="number" name="amount" class="form-control" id="editTxAmount" step="0.01" min="0.01"
                    required>
            </div>
            <div class="mb-3">
                <label class="form-label">Date</label>
                <input type="date" name="date" class="form-control" id="editTxDate" required>
            </div>
            <button type="submit" class="btn-primary-custom w-100">Update Transaction</button>
        </form>
    </div>
</div>

<script>
    const API = {
        transactions: '{% url "api_transactions" %}',
        editTx: (pk) => `/edit/${pk}/`,
        deleteTx: (pk) => `/delete-ajax/${pk}/`
    };

    const fmt = n => '₹ ' + parseFloat(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const typeFilter = document.getElementById('transactionTypeFilter');

    function loadTransactions() {
        const params = new URLSearchParams();
        if (typeFilter.value) params.set('type', typeFilter.value);
        const url = params.size ? `${API.transactions}?${params}` : API.transactions;
        fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
            .then(r => {
                if (!r.ok) throw new Error('Unable to load transaction history.');
                return r.json();
            })
            .then(d => {
                const tbody = document.getElementById('fullTransactionsList');
                if (!d.transactions || !d.transactions.length) {
                    tbody.innerHTML = '<tr><td colspan="4" class="no-data">No transactions found.</td></tr>';
                    return;
                }
                tbody.innerHTML = d.transactions.map(t => {
                    const isIncome = t.category_type === 'income';
                    return `
                    <tr>
                        <td style="color:#64748b; font-size:0.85rem;">${t.date}</td>
                        <td><span class="badge-${isIncome ? 'income' : 'expense'}">${escapeHtml(t.category)}</span></td>
                        <td class="text-end fw-bold" style="color:${isIncome ? '#16a34a' : '#dc2626'}">${fmt(t.amount)}</td>
                        <td class="text-end">
                            <button class="btn-sm-custom btn-edit me-1" aria-label="Edit transaction"
                                onclick="openEditModal(${t.id}, ${t.category_id}, ${t.amount}, '${t.date}')"><i class="bi bi-pencil-fill"></i></button>
                            <button class="btn-sm-custom btn-delete" aria-label="Delete transaction" onclick="deleteTx(${t.id})"><i class="bi bi-trash-fill"></i></button>
                        </td>
                    </tr>`;
                }).join('');
            })
            .catch(error => {
                document.getElementById('fullTransactionsList').innerHTML =
                    `<tr><td colspan="4" class="no-data">${escapeHtml(error.message)}</td></tr>`;
                console.error('Error loading transactions:', error);
            });
    }

    function openEditModal(pk, categoryId, amount, date) {
        document.getElementById('editTxPk').value = pk;
        document.getElementById('editTxAmount').value = amount;
        document.getElementById('editTxDate').value = date;

        const sel = document.getElementById('editTxCategory');
        sel.innerHTML = window.globalCategoryCache.map(c =>
            `<option value="${c.id}" ${String(c.id) === String(categoryId) ? 'selected' : ''}>${escapeHtml(c.name)}</option>`
        ).join('');

        openModal('editTransactionModal');
    }

    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, char => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[char]);
    }

    function deleteTx(pk) {
        if (!confirm('Are you sure you want to delete this transaction?')) return;

        let formData = new FormData();
        formData.append('csrfmiddlewaretoken', getCookie('csrftoken'));

        fetch(API.deleteTx(pk), {
            method: 'POST',
            body: formData,
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
            .then(r => {
                if (r.ok) {
                    showToast('Transaction deleted.', 'success');
                    loadTransactions();
                } else showToast('Failed to delete transaction.', 'error');
            })
            .catch(() => showToast('Network error.', 'error'));
    }

    document.getElementById('editTxForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const pk = document.getElementById('editTxPk').value;
        const fd = new FormData(this);
        ajaxPost(API.editTx(pk), fd, 'Transaction updated!', () => {
            closeModal('editTransactionModal');
            loadTransactions();
        });
    });

    window.reloadAll = loadTransactions;
    typeFilter.value = new URLSearchParams(window.location.search).get('type') || '';
    document.getElementById('transactionFilterHint').textContent = typeFilter.value === 'income'
        ? 'Edit the amount, date, or category of any income entry.'
        : 'Select an income row and use the edit button to update it.';
    typeFilter.addEventListener('change', () => {
        const hint = document.getElementById('transactionFilterHint');
        hint.textContent = typeFilter.value === 'income'
            ? 'Edit the amount, date, or category of any income entry.'
            : 'Select an income row and use the edit button to update it.';
        loadTransactions();
    });
    document.addEventListener('DOMContentLoaded', loadTransactions);
</script>
{% endblock %}
